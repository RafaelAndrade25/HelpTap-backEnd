# ===================================================================
# CONFIGURACAO DO BANCO DE DADOS (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}?currentSchema=hpTap
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=hpTap

# Em producao, voce pode mudar para 'false' para nao poluir os logs do Railway, mas mantive ativo para seus testes
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# SEGURANCA E CRIPTOGRAFIA (JWT e LGPD)
# ===================================================================
spring.web.error.include-message=always

# Pega a variavel de producao. Se nao houver, usa as suas chaves locais
api.security.token.secret=${JWT_SECRET:my-secret-key}
jwt.secret=${JWT_SECRET_LONG:helpTapSecretKeyForJwtTokenGenerationAndValidation2024ThisMustBe512BitsLongForHS512Algorithm}
jwt.expiration=86400000

# Chave de criptografia dos dados sensiveis da LGPD
encryption.secret=${ENCRYPTION_SECRET:helpTapEncryptionKey2024ForSensitiveHealthData}

# ===================================================================
# INTEGRACAO COM A API MOCKADA E REGRAS DE NEGOCIO
# ===================================================================
# Importante: A URL da API Mockada sera injetada via variavel no Railway
credential.validation.api.url=${CREDENTIAL_API_URL:http://localhost:8081/api/validation/validate}
credential.validation.api.key=${CREDENTIAL_API_KEY:default-secret-key}
credential.validation.enabled=true

helptap.wearable.max-per-user=5
